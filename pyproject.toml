[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terminalmk-downloader"
version = "1.1.3"
description = "Batch downloader for terminal.mk filing attachments (companion app for the CF view's Download All button)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "terminal.mk" }]
urls = { Homepage = "https://github.com/terminal-mk/downloader" }
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
# tkinterdnd2 enables drag-and-drop of CSV files onto the home screen.
# Purely optional -- the GUI falls back to the Browse/paste-link controls
# if it isn't installed.
gui = ["tkinterdnd2>=2.3.0"]

[project.scripts]
"terminal.mk-dl" = "terminalmk_downloader.cli:main"
"terminal.mk-dl-gui" = "terminalmk_downloader.gui:main"

[tool.setuptools.packages.find]
include = ["terminalmk_downloader*"]

[tool.setuptools.package-data]
terminalmk_downloader = ["assets/*"]
